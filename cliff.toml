[changelog]
header = """
# Release Notes

Alle Änderungen seit dem letzten Release.
"""

body = """
{% if version %}
## {{ version }}
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}

{% endfor %}
"""

footer = """
---
## Installation

1. Download the latest `Regression Mod` ZIP file from the **Assets** section below.
   Do not download the source code ZIP files (`Source code (zip)` or `Source code (tar.gz)`).

2. Extract the contents of the ZIP file directly into your Stardew Valley Mods folder.

3. Your directory structure should look like this:

```text
Stardew Valley/
└── Mods/
    └── Regression Mod/
        ├── Regression/
        └── Regression Dialogue/
```
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
    { message = "^feat",      group = "🚀 Features" },
    { message = "^fix",       group = "🐛 Bug Fixes" },
    { message = "^perf",      group = "⚡ Performance" },
    { message = "^refactor",  group = "♻️ Refactoring" },
    { message = "^docs",      group = "📚 Documentation" },
    { message = "^style",     group = "🎨 Code Style" },
    { message = "^test",      group = "🧪 Tests" },
    { message = "^build",     group = "📦 Build" },
    { message = "^ci",        group = "⚙️ CI/CD" },
    { message = "^chore",     group = "🔧 Maintenance" }
]

commit_preprocessors = [
    { pattern = "\\(#([0-9]+)\\)", replace = "[#$1](../../pull/$1)" }
]

filter_commits = true

tag_pattern = "v[0-9].*"

ignore_tags = ""
